[package]
name = "animated-linux"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Animated wallpaper engine for Linux"

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
walkdir = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
base64 = "0.22"
steamworks = { version = "0.13.1", optional = true }

[features]
default = []
steam = ["dep:steamworks"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
